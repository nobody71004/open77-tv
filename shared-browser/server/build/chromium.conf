; --kiosk is what makes the room a screen: no tab strip, no address bar, no
; "chrome" of any kind, so a browser cinema shows the page and nothing else --
; which matters most for Android, where the game wants every pixel. Tabs still
; exist (the room service opens the new one and closes the old), they are just
; not drawn; a closed window comes back through autorestart.
;
; Full screen is the window manager's answer, not Chromium's: openbox.conf runs
; the window manager that gives the kiosk window the whole 1280x720 screen. With
; none, the same flags open a 1050x700 window in the corner.
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/chromium
  --no-sandbox
  --window-position=0,0
  --display=%(ENV_DISPLAY)s
  --user-data-dir=/profiles/active
  --no-first-run
  --kiosk
  --bwsi
  --force-dark-mode
  --disable-file-system
  --disable-gpu
  --disable-software-rasterizer
  --disable-dev-shm-usage
  --remote-debugging-port=9223
  --remote-debugging-address=127.0.0.1
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

; Chromium only ever binds its DevTools socket to loopback (it ignores
; --remote-debugging-address for this), and the room service runs on the host,
; not in this container. This forwards the container's own address to it, so
; "open Android" can drive the room without publishing anything: the port is not
; in any docker -p list, and the host's INPUT policy drops it from outside.
[program:cdp]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9223
autorestart=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/cdp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
