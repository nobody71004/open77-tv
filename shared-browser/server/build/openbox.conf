; The window manager the room needs and the stock image does not run.
;
; Chromium's kiosk window asks the window manager to be full screen; with no
; window manager on the display it opens at Chrome's default size instead --
; measured on 2026-10-22: 1050x700 on a 1280x720 screen, so a browser cinema
; showed a black band down the side and the Android screen was cropped. With
; openbox (already in the neko image) before Chromium, the window is 1280x720 at
; 0,0 and the page gets every pixel.
;
; priority 700 starts it before chromium (800). It draws no panel and no
; desktop, and the only window it manages is the room's own.
[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox
autorestart=true
priority=700
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
